<!DOCTYPE html>
<html lang="en" class="bg-white text-black transition-colors duration-300">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BitIron | Athlete Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="/src/styles/global.css">
  </head>
  <body class="font-sans antialiased min-h-screen flex flex-col bg-[#f0f0f0] dark:bg-[#0a0a0a] text-black dark:text-white transition-colors duration-300 relative overflow-x-hidden pt-24">
    
    <div id="navbar-root"></div>

    <main class="flex-grow flex flex-col items-center justify-start w-full relative z-10 px-6 max-w-7xl mx-auto pb-24">
      
      <!-- DASHBOARD HEADER -->
      <div class="w-full border-b-4 border-black dark:border-white mb-12 pb-6 flex flex-col md:flex-row justify-between items-end gap-6 relative">
        <div>
          <p class="text-[#e62429] font-black uppercase tracking-widest text-sm mb-2">Athlete Profile</p>
          <h1 class="text-6xl md:text-8xl font-black uppercase tracking-tighter leading-none" id="user-name">
            LOADING_
          </h1>
        </div>
        <div class="text-right">
          <p class="text-xs uppercase tracking-widest font-bold opacity-50 mb-1">Status</p>
          <div class="inline-flex items-center gap-2 border-2 border-black dark:border-white px-4 py-2 bg-black text-white dark:bg-white dark:text-black">
            <span class="w-2 h-2 bg-[#e62429] rounded-full animate-pulse"></span>
            <span class="font-black text-xs uppercase tracking-widest">Active</span>
          </div>
        </div>
        
        <!-- Decoration -->
        <div class="absolute -top-12 -right-4 opacity-5 pointer-events-none text-[150px] font-black leading-none select-none hidden md:block">
          DSHBRD
        </div>
      </div>

      <!-- MAIN CONTENT GRID -->
      <div class="w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- SIDEBAR -->
        <div class="lg:col-span-4 flex flex-col gap-6">
          <div class="border-2 border-black dark:border-white p-6 relative overflow-hidden bg-white dark:bg-[#111]">
            <div class="absolute top-0 right-0 w-16 h-16 bg-[#e62429] transform translate-x-8 -translate-y-8 rotate-45"></div>
            <h3 class="font-black uppercase text-xl mb-6 tracking-tight flex items-center gap-3">
              <i class="fa-solid fa-user-shield text-[#e62429]"></i> Metrics
            </h3>
            <div class="space-y-4">
              <div>
                <p class="text-[10px] font-black uppercase tracking-widest opacity-50 mb-1">Email</p>
                <p class="font-bold font-mono text-sm" id="user-email">...</p>
              </div>
              <div>
                <p class="text-[10px] font-black uppercase tracking-widest opacity-50 mb-1">Goal</p>
                <p class="font-bold font-mono text-sm text-[#e62429]" id="user-goal">...</p>
              </div>
              <div>
                <p class="text-[10px] font-black uppercase tracking-widest opacity-50 mb-1">Member Since</p>
                <p class="font-bold font-mono text-sm" id="user-date">...</p>
              </div>
            </div>
          </div>
          
          <div class="bg-[#e62429] text-white p-6 border-2 border-black dark:border-white">
            <h3 class="font-black uppercase text-xl mb-2 tracking-tight">Need Gear?</h3>
            <p class="text-sm font-bold opacity-80 mb-6">Equip yourself with elite supplements to match your plan.</p>
            <a href="/index.html#arsenal" class="inline-block bg-black text-white px-6 py-3 font-black uppercase text-xs tracking-widest hover:bg-white hover:text-black transition-colors w-full text-center">
              Enter Arsenal →
            </a>
          </div>
        </div>

        <!-- MAIN AREA: AI PLANS -->
        <div class="lg:col-span-8 flex flex-col gap-6">
          <div class="flex justify-between items-center border-b-2 border-black dark:border-white pb-4">
            <h2 class="font-black uppercase text-3xl tracking-tighter">
              Elite Blueprints <span class="text-[#e62429]">(AI)</span>
            </h2>
            <a href="/advisor.html" class="border border-black dark:border-white px-4 py-2 font-black uppercase text-[10px] tracking-widest hover:bg-black hover:text-white dark:hover:bg-white dark:hover:text-black transition-colors">
              + Generate New
            </a>
          </div>
          
          <div id="plans-container" class="space-y-6 flex flex-col relative min-h-[300px]">
            <!-- Loader -->
            <div id="plans-loader" class="absolute inset-0 flex flex-col items-center justify-center">
              <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-[#e62429]"></i>
              <p class="font-black uppercase tracking-widest text-xs opacity-50">Decrypting Plans...</p>
            </div>
          </div>
        </div>

      </div>
    </main>

    <div id="footer-root"></div>

    <!-- Script Entry Point -->
    <script type="module" src="/src/dashboard.js"></script>
  </body>
</html>
