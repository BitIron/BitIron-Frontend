<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - BitIron Elite</title>
  <style>
    /* Prevent FOUC (Flash of Unstyled Content) */
    .fouc-prevent { opacity: 0; }
  </style>
</head>
<body class="bg-white text-black min-h-screen flex flex-col font-sans selection:bg-black selection:text-white fouc-prevent overflow-x-hidden">
  
  <div id="navbar-container"></div>

  <main class="flex-grow pt-24 pb-20 px-6 lg:px-16 w-full max-w-[1400px] mx-auto">
    <!-- Header -->
    <div class="mb-12 border-b-2 border-black pb-6">
      <p class="text-[10px] font-black uppercase tracking-[0.3em] text-red-600 mb-2">SECURE PROCESS</p>
      <h1 class="text-5xl lg:text-7xl font-black uppercase tracking-tighter leading-none">YOUR <span class="italic">ARSENAL</span></h1>
    </div>

    <!-- Layout Grid -->
    <div class="grid grid-cols-1 xl:grid-cols-12 gap-12 items-start">
      
      <!-- Cart Items Column (Left) -->
      <div class="xl:col-span-8 flex flex-col gap-6" id="cart-items-container">
        <!-- Skeleton Loaders -->
        <div class="w-full h-32 bg-gray-100 animate-pulse border border-black/10"></div>
        <div class="w-full h-32 bg-gray-100 animate-pulse border border-black/10"></div>
        <div class="w-full h-32 bg-gray-100 animate-pulse border border-black/10"></div>
      </div>

      <!-- Order Summary Column (Right) -->
      <div class="xl:col-span-4 sticky top-32 bg-white border-4 border-black p-8 shadow-[8px_8px_0px_0px_rgba(230,36,41,1)]">
        <h2 class="text-2xl font-black uppercase tracking-tighter border-b border-black/10 pb-4 mb-6">ORDER SUMMARY</h2>
        
        <div class="flex flex-col gap-4 text-sm font-bold uppercase tracking-wider mb-6">
          <div class="flex justify-between items-center">
            <span class="text-black/60">SUBTOTAL</span>
            <span id="summary-subtotal">0.00 €</span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-black/60">SHIPPING</span>
            <span class="text-green-600">FREE</span>
          </div>
          <div class="flex justify-between items-center text-lg mt-4 border-t border-black/10 pt-4">
            <span>TOTAL</span>
            <span id="summary-total" class="text-red-600">0.00 €</span>
          </div>
        </div>

        <button id="btn-checkout" class="w-full bg-black text-white py-4 font-black uppercase tracking-[0.2em] hover:bg-red-600 transition-colors duration-300 group flex justify-center items-center gap-2">
          PROCEED TO PAYMENT
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="group-hover:translate-x-1 transition-transform"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </button>

        <p class="text-[9px] font-black uppercase tracking-[0.1em] text-black/40 text-center mt-4">
          SECURE ENCRYPTED TRANSACTION
        </p>
      </div>

    </div>
  </main>

  <div id="footer-container" class="mt-auto"></div>

  <script type="module" src="/src/checkout.js"></script>
</body>
</html>
